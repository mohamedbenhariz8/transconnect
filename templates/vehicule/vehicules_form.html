{% extends 'base.html' %}

{% block title %}Véhicule{% endblock %}
{% block style %}{% include '_form_style.html' %}{% endblock %}

{% block content %}
<h1>
    {% if form.instance.pk %}
        Update Vehicule
    {% else %}
        Create Vehicule
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Update{% else %}Create{% endif %} Vehicule</button>
    <a href="{% url 'mes_vehicules' %}">Cancel</a>
</form>
{% endblock %}
