{% extends 'base.html' %}

{% block title %}Retirer l'offre{% endblock %}
{% block style %}{% include '_delete_style.html' %}{% endblock %}

{% block content %}
<h1>Offre Delete Confirmation</h1>
<p>Are you sure you want to delete the offre: {{ object }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'offres_list' %}">Cancel</a>
</form>
{% endblock %}
