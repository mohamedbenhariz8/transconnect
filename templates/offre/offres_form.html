{% extends 'base.html' %}

{% block title %}Offre{% endblock %}
{% block style %}{% include '_form_style.html' %}{% endblock %}

{% block content %}
<h1>
    {% if form.instance.pk %}
        Update Offre
    {% else %}
        Proposer une offre
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Update{% else %}Create{% endif %} Offre</button>
    <a href="{% url 'offres_list' %}">Cancel</a>
</form>
{% endblock %}
