<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; }
    </style>
</head>
<body>
    <h1>Expeditions List</h1>
    <!-- table avec css -->
    <table>
        <thead>
            <tr>
                <th>Reference</th>
                <th>Ville Depart</th>
                <th>Ville Arrivee</th>
                <th>Date Souhaitee</th>
                
            </tr>
        </thead>
        <tbody>
            {% for expedition in liste %}
            <tr>
                <td><a href="{% url 'detail' expedition.pk %}">{{ expedition.reference }}</a></td>
                <td>{{ expedition.ville_depart }}</td>
                <td>{{ expedition.ville_arrivee }}</td>
                <td>{{ expedition.date_souhaitee }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No expeditions available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
