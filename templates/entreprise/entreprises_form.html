{% extends 'base.html' %}

{% block title %}Entreprise{% endblock %}
{% block style %}{% include '_form_style.html' %}{% endblock %}

{% block content %}
<h1>
    {% if form.instance.pk %}
        Update Entreprise
    {% else %}
        Créer mon entreprise
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Update{% else %}Create{% endif %} Entreprise</button>
    <a href="{% url 'entreprises_list' %}">Cancel</a>
</form>
{% endblock %}
