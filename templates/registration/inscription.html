{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}
{% block style %}{% include '_form_style.html' %}{% endblock %}

{% block content %}
<h1>Inscription</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Créer mon compte</button>
    <p>Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
</form>
{% endblock %}
